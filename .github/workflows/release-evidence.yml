name: Release evidence

on:
  release:
    types: [published]

permissions: {}
concurrency:
  group: release-evidence-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      subject: ${{ steps.subject.outputs.artifact-id }}
    steps:
      - name: Check the tag against main CI before running repository code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=1" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '.workflow_runs[0] |
              .repository.full_name == $repo and .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Select the successful main push and its immutable artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/release-evidence.ts select
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run }}
          artifact-ids: ${{ steps.ci.outputs.verdict }}
          path: ${{ runner.temp }}/release-verdict
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run }}
          artifact-ids: ${{ steps.ci.outputs.inputs }}
          path: ${{ runner.temp }}/release-inputs
          digest-mismatch: error
      - name: Validate the Contrarian receipt and hash its evidence
        run: node --import tsx scripts/release-evidence.ts manifest
      - name: Retain the downloadable attestation subject
        id: subject
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playwright-evidence.json
          if-no-files-found: error

  attest:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.subject }}
          path: ${{ runner.temp }}/subject
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/subject/playwright-evidence.json
          create-storage-record: false

  publish:
    needs: [validate, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.subject }}
          path: ${{ runner.temp }}/subject
          digest-mismatch: error
      - name: Attach the verified subject to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          subject="$RUNNER_TEMP/subject/playwright-evidence.json"
          gh attestation verify "$subject" -R "$GITHUB_REPOSITORY" --deny-self-hosted-runners \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api "$release" | jq -e --arg tag "$RELEASE_TAG" --argjson id "$RELEASE_ID" \
            '.id == $id and .tag_name == $tag and .draft == false and .published_at != null'
          ref=$(jq -rn --arg ref "$GITHUB_REF" '$ref | @uri')
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)" = "$GITHUB_SHA"
          asset_id() {
            gh api --paginate "$release/assets?per_page=100" --jq '.[] | select(.name == "playwright-evidence.json") | .id'
          }
          id=$(asset_id)
          if [[ -z "$id" ]]; then
            code=$(curl --silent --show-error --proto '=https' --output "$RUNNER_TEMP/asset-response.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/json' --data-binary "@$subject" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=playwright-evidence.json")
            # A parallel upload may win the name. Accept it only after comparing the actual asset bytes.
            if [[ "$code" != 201 && "$code" != 422 ]]; then echo "Release asset upload returned HTTP $code." >&2; exit 1; fi
            id=$(asset_id)
          fi
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "The release has no downloadable evidence asset." >&2; exit 1; }
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/published-evidence.json"
          cmp "$subject" "$RUNNER_TEMP/published-evidence.json" || { echo "The release already contains different evidence." >&2; exit 1; }
