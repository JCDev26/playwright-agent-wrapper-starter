<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Review task board</title>
<style>
  body { margin: 3rem auto; padding: 0 1rem; max-width: 42rem; font: 18px/1.5 system-ui; color: #182b45; background: #f5f7fb; }
  main { background: white; padding: 2rem; border: 1px solid #d6dfec; border-radius: 1rem; }
  h1 { margin-top: 0; } input, button { font: inherit; padding: .55rem; }
  button { background: #204bb5; color: white; border: 0; border-radius: .3rem; cursor: pointer; }
  li { margin: 1rem 0; } [role=alert] { color: #a02121; } [role=status] { color: #235b38; }
</style>
<main>
  <h1>Review task board</h1>
  <p>Local demonstration. Tasks remain in this page only.</p>
  <form novalidate>
    <label for="task">Task</label>
    <input id="task" autocomplete="off" maxlength="100">
    <button type="submit">Add task</button>
    <p role="alert"></p>
  </form>
  <ul aria-label="Tasks"></ul>
  <p role="status">0 open tasks</p>
</main>
<script>
  const form = document.querySelector('form');
  const input = document.querySelector('input');
  const list = document.querySelector('ul');
  const alert = document.querySelector('[role=alert]');
  const status = document.querySelector('[role=status]');
  const update = () => {
    const open = list.querySelectorAll('input:not(:checked)').length;
    status.textContent = `${open} open ${open === 1 ? 'task' : 'tasks'}`;
  };
  form.addEventListener('submit', event => {
    event.preventDefault();
    const title = input.value.trim();
    if (!title) { alert.textContent = 'Enter a task before adding it.'; return; }
    alert.textContent = '';
    const item = document.createElement('li');
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.addEventListener('change', update);
    label.append(checkbox, document.createTextNode(' ' + title));
    item.append(label); list.append(item); input.value = ''; update();
  });
</script>
</html>
